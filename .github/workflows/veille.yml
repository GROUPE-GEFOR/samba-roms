name: Veille des versions de Samba

on:
  schedule:
    - cron: "17 5 * * *"     # chaque jour à 05h17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : afficher ce qui serait fait, sans compiler ni créer de ticket"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write     # lancer build.yml et garder la veille active
  issues: write      # tickets d'information (notifiés par e-mail)

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      VEILLE_MENTION: ${{ vars.VEILLE_MENTION }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v7
      # GitHub désactive les tâches planifiées d'un dépôt public sans activité depuis 60 jours :
      # réactiver la veille à chaque exécution remet ce délai à zéro.
      - name: Garder la veille active
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/veille.yml/enable" || true
      - name: Veille
        run: bash scripts/veille.sh

  # Page d'accueil du dépôt APT (versions existantes et à venir) : régénérée chaque jour, après les compilations.
  page:
    needs: veille
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - name: Page du dépôt APT
        run: |
          bash scripts/page.sh site
          cd site
          # la ligne « Page mise à jour le … » change à chaque fois : elle ne compte pas
          if git diff --quiet -I 'id="maj"' && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Page inchangée"; exit 0
          fi
          git --no-pager diff --stat
          [ "$DRY_RUN" = true ] && { echo "Essai à blanc : page non publiée"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          old=$(git rev-parse HEAD)
          # gh-pages garde un seul commit ; si une publication a eu lieu entre-temps, ne rien écraser
          git add -A
          git commit -q --amend --no-edit
          git push -q --force-with-lease="gh-pages:$old" origin HEAD:gh-pages \
            || echo "::warning::gh-pages a changé pendant la génération : page laissée à la publication suivante"
