# Paquet source Debian dont on reprend le répertoire debian/, par branche Samba et par distribution.
#
# branche  distribution  version Debian du donneur (avec époque)  profils de compilation (virgules, - = aucun)  dépôt de compilation en plus (- = aucun)
#
# Le donneur est téléchargé sur deb.debian.org, ou sur snapshot.debian.org s'il a quitté l'archive.
# Pour bookworm, Debian recompile le packaging trixie avec le profil pkg.samba.before-trixie
# (ses paquets ~bpo12) : on fait de même, avec le packaging le plus proche de la version compilée.
# Pour trixie, ngtcp2 (QUIC, Samba ≥ 4.23) est la copie intégrée à Samba : celle de trixie est trop
# ancienne, et prendre celle de trixie-backports rendrait les serveurs dépendants de trixie-backports.
# Les paquets ne doivent dépendre que de la distribution elle-même (vérifié par scripts/smoke-test.sh).
# Le paramètre « donor » de l'action GitHub remplace ponctuellement la version de ce fichier.

